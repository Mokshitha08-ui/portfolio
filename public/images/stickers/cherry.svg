<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cherry-shadow" x="-15%" y="-15%" width="135%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="4" stdDeviation="3.5" flood-color="#282020" flood-opacity="0.16"/>
    </filter>
    <radialGradient id="cherry-left" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#E24B66"/>
      <stop offset="40%" stop-color="#9B1C31"/>
      <stop offset="85%" stop-color="#671020"/>
      <stop offset="100%" stop-color="#3B050F"/>
    </radialGradient>
    <radialGradient id="cherry-right" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#E24B66"/>
      <stop offset="40%" stop-color="#9B1C31"/>
      <stop offset="85%" stop-color="#671020"/>
      <stop offset="100%" stop-color="#3B050F"/>
    </radialGradient>
    <linearGradient id="stem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#688647"/>
      <stop offset="100%" stop-color="#465C2B"/>
    </linearGradient>
  </defs>

  <g filter="url(#cherry-shadow)">
    <!-- White Sticker Cutout Border -->
    <path d="M 60 12 C 55 12 40 28 35 48 C 22 55 15 72 20 88 C 25 104 42 112 56 108 C 66 104 70 94 74 88 C 80 98 94 104 104 96 C 114 86 112 70 102 60 C 95 52 82 52 74 60 C 70 42 66 22 62 12 Z"
          fill="#FFFFFF" stroke="#EDE8DF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Green Stems Joining at Top -->
    <!-- Stems meeting at joint -->
    <ellipse cx="61" cy="17" rx="3.5" ry="2.5" fill="#4B602D"/>
    
    <!-- Left Stem -->
    <path d="M 61 17 C 50 32 40 54 44 76" stroke="url(#stem-grad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Right Stem -->
    <path d="M 61 17 C 68 35 78 52 86 68" stroke="url(#stem-grad)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Leaf on Stem -->
    <path d="M 62 20 C 72 16 84 20 88 28 C 80 32 68 30 62 20 Z" fill="#688647"/>
    <path d="M 62 20 C 70 23 80 25 88 28" stroke="#465C2B" stroke-width="0.8" fill="none"/>

    <!-- Left Cherry Fruit -->
    <circle cx="43" cy="85" r="21" fill="url(#cherry-left)"/>
    <!-- Indentation on top of cherry -->
    <path d="M 41 68 C 43 69 45 69 47 68" stroke="#3B050F" stroke-width="2" stroke-linecap="round"/>
    <!-- Specular Highlight Curve -->
    <ellipse cx="37" cy="78" rx="6" ry="3.5" transform="rotate(-35 37 78)" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="34" cy="85" r="1.5" fill="#FFFFFF" opacity="0.6"/>

    <!-- Right Cherry Fruit -->
    <circle cx="85" cy="77" r="19" fill="url(#cherry-right)"/>
    <path d="M 83 62 C 85 63 87 63 89 62" stroke="#3B050F" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="80" cy="71" rx="5.5" ry="3" transform="rotate(-35 80 71)" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="77" cy="77" r="1.2" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
