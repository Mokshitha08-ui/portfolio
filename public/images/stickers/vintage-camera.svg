<svg width="240" height="190" viewBox="0 0 240 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="camera-shadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#282020" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E7E9EC"/>
      <stop offset="70%" stop-color="#C2C7CE"/>
      <stop offset="100%" stop-color="#9FA5AE"/>
    </linearGradient>
    <linearGradient id="leather-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#342825"/>
      <stop offset="50%" stop-color="#261E1C"/>
      <stop offset="100%" stop-color="#1B1514"/>
    </linearGradient>
    <radialGradient id="lens-glass" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#2E3C4D"/>
      <stop offset="40%" stop-color="#182330"/>
      <stop offset="75%" stop-color="#0E1620"/>
      <stop offset="100%" stop-color="#05080C"/>
    </radialGradient>
    <linearGradient id="lens-flare" x1="10%" y1="10%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#55A0DF" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#9B1C31" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather-texture" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#2D221F"/>
      <rect x="2" y="2" width="2" height="2" fill="#201815"/>
    </pattern>
  </defs>

  <g filter="url(#camera-shadow)">
    <!-- White Sticker Cutout Border -->
    <rect x="15" y="20" width="210" height="150" rx="16" fill="#FFFFFF" stroke="#EDE8DF" stroke-width="2"/>

    <!-- CAMERA BODY -->
    <!-- Lower Body (Leatherette) -->
    <rect x="24" y="60" width="192" height="100" rx="8" fill="url(#leather-grad)"/>
    <rect x="24" y="60" width="192" height="100" rx="8" fill="url(#leather-texture)" opacity="0.6"/>

    <!-- Chrome Bottom Plate -->
    <path d="M 24 152 L 216 152 L 216 158 C 216 161 213 164 210 164 L 30 164 C 27 164 24 161 24 158 Z" fill="url(#chrome-grad)" stroke="#8F969F" stroke-width="0.7"/>

    <!-- Chrome Top Plate -->
    <path d="M 24 64 L 24 38 C 24 34 27 32 30 32 L 210 32 C 213 32 216 34 216 38 L 216 64 Z" fill="url(#chrome-grad)" stroke="#8F969F" stroke-width="0.7"/>
    <line x1="24" y1="64" x2="216" y2="64" stroke="#6F7680" stroke-width="1"/>

    <!-- Mechanical Dials on Top Plate -->
    <!-- Shutter Speed Dial (Left) -->
    <rect x="46" y="24" width="28" height="8" rx="2" fill="url(#chrome-grad)" stroke="#6F7680" stroke-width="0.8"/>
    <line x1="53" y1="24" x2="53" y2="32" stroke="#444" stroke-width="0.6"/>
    <line x1="60" y1="24" x2="60" y2="32" stroke="#444" stroke-width="0.6"/>
    <line x1="67" y1="24" x2="67" y2="32" stroke="#444" stroke-width="0.6"/>

    <!-- Shutter Release Button (Right) -->
    <rect x="172" y="22" width="14" height="10" rx="2" fill="url(#chrome-grad)" stroke="#6F7680" stroke-width="0.8"/>
    <rect x="174" y="19" width="10" height="3" rx="1" fill="#BA2742"/>

    <!-- Film Advance Lever -->
    <path d="M 194 28 L 214 26 L 212 32 L 194 32 Z" fill="#AEB3B9" stroke="#6F7680" stroke-width="0.8"/>

    <!-- Viewfinder Window (Front Right) -->
    <rect x="165" y="40" width="24" height="15" rx="3" fill="#1C2833" stroke="#AEB3B9" stroke-width="1.2"/>
    <rect x="168" y="43" width="18" height="9" rx="1.5" fill="#4B6584" opacity="0.8"/>
    <!-- Viewfinder Glare -->
    <path d="M 168 43 L 176 43 L 172 52 L 168 52 Z" fill="#FFFFFF" opacity="0.4"/>

    <!-- Rangefinder Window Small (Front Center) -->
    <rect x="135" y="44" width="12" height="10" rx="2" fill="#E8A738" stroke="#AEB3B9" stroke-width="0.8"/>

    <!-- Red Accent Dot (Classic Leica inspired) -->
    <circle cx="58" cy="84" r="9" fill="#9B1C31" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="54" y="87" font-family="'Playfair Display', serif" font-weight="700" font-size="8" fill="#FFFFFF">M</text>

    <!-- LARGE CAMERA LENS (CENTRAL) -->
    <!-- Outer Metal Mount Ring -->
    <circle cx="120" cy="110" r="48" fill="url(#chrome-grad)" stroke="#7A808A" stroke-width="1.5"/>
    <!-- Ribbed Focus Ring -->
    <circle cx="120" cy="110" r="44" fill="#241E1C" stroke="#403835" stroke-width="1.5"/>
    <circle cx="120" cy="110" r="42" fill="none" stroke="#685E5A" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Aperture Value Markings Ring -->
    <circle cx="120" cy="110" r="38" fill="#161312" stroke="#000000" stroke-width="1"/>
    <text x="110" y="78" font-family="'JetBrains Mono', monospace" font-size="5" fill="#DFDFDF" letter-spacing="1">f/1.4  50mm</text>
    <text x="108" y="146" font-family="'JetBrains Mono', monospace" font-size="4.5" fill="#BA2742" letter-spacing="0.5">MADE WITH PASSION</text>

    <!-- Multi-coated Glass Element -->
    <circle cx="120" cy="110" r="30" fill="url(#lens-glass)"/>
    <circle cx="120" cy="110" r="28" fill="url(#lens-flare)"/>

    <!-- Aperture Blades Inner Hole -->
    <circle cx="120" cy="110" r="14" fill="#050608"/>
    <!-- Specular Highlight Reflections -->
    <ellipse cx="112" cy="102" rx="7" ry="4" transform="rotate(-30 112 102)" fill="#FFFFFF" opacity="0.75"/>
    <ellipse cx="128" cy="120" rx="3.5" ry="2" transform="rotate(-30 128 120)" fill="#78B9ED" opacity="0.6"/>
  </g>
</svg>
