<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mana-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EFE8DB"/>
    </linearGradient>
    <filter id="card-drop" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#282020" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Browser Frame Window -->
  <rect width="600" height="380" rx="12" fill="url(#mana-bg)" stroke="#E4DCD0" stroke-width="2"/>

  <!-- Browser Chrome Top Bar -->
  <rect width="600" height="36" rx="12" fill="#EBE4D8"/>
  <rect y="24" width="600" height="12" fill="#EBE4D8"/>
  <line x1="0" y1="36" x2="600" y2="36" stroke="#DDD4C5" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="20" cy="18" r="4" fill="#E26D5C"/>
  <circle cx="34" cy="18" r="4" fill="#E8B86D"/>
  <circle cx="48" cy="18" r="4" fill="#70B77E"/>

  <!-- URL Bar Pill -->
  <rect x="120" y="8" width="360" height="20" rx="10" fill="#FAF6EF" stroke="#DFD5C4" stroke-width="1"/>
  <text x="300" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7A6C65" text-anchor="middle">mana-community.app/dashboard</text>

  <!-- Application Content -->
  <!-- Sidebar -->
  <rect x="20" y="52" width="130" height="308" rx="8" fill="#F4EDE2" stroke="#E5DCD0" stroke-width="1"/>
  <!-- Logo -->
  <text x="36" y="80" font-family="'Playfair Display', serif" font-weight="700" font-size="16" fill="#9B1C31">Mana.</text>
  <text x="80" y="79" font-family="'JetBrains Mono', monospace" font-size="8" fill="#751426" opacity="0.7">COMMUNITY</text>
  <!-- Nav items -->
  <rect x="28" y="98" width="114" height="24" rx="4" fill="#9B1C31" opacity="0.12"/>
  <text x="38" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#9B1C31">Residents & Gate</text>
  <text x="38" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#5C4E49">Events & Sports</text>
  <text x="38" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#5C4E49">Worker Logs</text>
  <text x="38" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#5C4E49">Service Requests</text>
  <text x="38" y="226" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#5C4E49">Role Workflows</text>

  <!-- Main Content Dashboard -->
  <!-- Header Stats Row -->
  <g filter="url(#card-drop)">
    <rect x="165" y="52" width="130" height="70" rx="8" fill="#FFFFFF" stroke="#EAE2D5" stroke-width="1"/>
    <text x="180" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8B7B74">Active Residents</text>
    <text x="180" y="102" font-family="'Playfair Display', serif" font-weight="700" font-size="22" fill="#282020">1,420</text>
    <text x="250" y="102" font-family="'JetBrains Mono', monospace" font-size="8" fill="#4B8B3B">● Live</text>

    <rect x="305" y="52" width="130" height="70" rx="8" fill="#FFFFFF" stroke="#EAE2D5" stroke-width="1"/>
    <text x="320" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8B7B74">Gate Approvals Today</text>
    <text x="320" y="102" font-family="'Playfair Display', serif" font-weight="700" font-size="22" fill="#9B1C31">384</text>

    <rect x="445" y="52" width="135" height="70" rx="8" fill="#FFFFFF" stroke="#EAE2D5" stroke-width="1"/>
    <text x="460" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8B7B74">Upcoming Events</text>
    <text x="460" y="102" font-family="'Playfair Display', serif" font-weight="700" font-size="22" fill="#282020">12</text>
  </g>

  <!-- Community Activity Table / List -->
  <g filter="url(#card-drop)">
    <rect x="165" y="136" width="415" height="224" rx="8" fill="#FFFFFF" stroke="#EAE2D5" stroke-width="1"/>
    <!-- Table Title -->
    <text x="185" y="164" font-family="'Playfair Display', serif" font-size="13" font-weight="600" fill="#282020">Real-Time Resident & Worker Streams</text>
    <rect x="500" y="152" width="65" height="18" rx="4" fill="#E8C7C7" opacity="0.5"/>
    <text x="532" y="164" font-family="'JetBrains Mono', monospace" font-size="8" fill="#9B1C31" text-anchor="middle">Spring Boot API</text>

    <!-- Table Rows -->
    <!-- Row 1 -->
    <line x1="185" y1="180" x2="565" y2="180" stroke="#F0E8DC" stroke-width="1"/>
    <circle cx="198" cy="200" r="10" fill="#E9DED0"/>
    <text x="198" y="203" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#751426" text-anchor="middle">RG</text>
    <text x="220" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#282020">Resident Gate Pass — Block B-402</text>
    <text x="220" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#8B7B74">Visitor: Delivery (Amazon) • Verified OTP</text>
    <rect x="495" y="193" width="70" height="16" rx="8" fill="#E5F3E7"/>
    <text x="530" y="204" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#2D7A38" text-anchor="middle">APPROVED</text>

    <!-- Row 2 -->
    <line x1="185" y1="225" x2="565" y2="225" stroke="#F0E8DC" stroke-width="1"/>
    <circle cx="198" cy="245" r="10" fill="#E8C7C7"/>
    <text x="198" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#9B1C31" text-anchor="middle">SC</text>
    <text x="220" y="243" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#282020">Clubhouse Badminton Court #2</text>
    <text x="220" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#8B7B74">Sports Slot Booking • 6:00 PM - 7:00 PM</text>
    <rect x="495" y="238" width="70" height="16" rx="8" fill="#F8ECEE"/>
    <text x="530" y="249" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#9B1C31" text-anchor="middle">CONFIRMED</text>

    <!-- Row 3 -->
    <line x1="185" y1="270" x2="565" y2="270" stroke="#F0E8DC" stroke-width="1"/>
    <circle cx="198" cy="290" r="10" fill="#E9DED0"/>
    <text x="198" y="293" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#751426" text-anchor="middle">WK</text>
    <text x="220" y="288" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#282020">Maintenance Staff Shift Check-In</text>
    <text x="220" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#8B7B74">Electrician ID #0492 • Tower A & C</text>
    <rect x="495" y="283" width="70" height="16" rx="8" fill="#E5F3E7"/>
    <text x="530" y="294" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#2D7A38" text-anchor="middle">ON DUTY</text>

    <!-- Row 4 -->
    <line x1="185" y1="315" x2="565" y2="315" stroke="#F0E8DC" stroke-width="1"/>
    <circle cx="198" cy="335" r="10" fill="#E9DED0"/>
    <text x="198" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#751426" text-anchor="middle">EV</text>
    <text x="220" y="333" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#282020">Community Cultural Festival 2026</text>
    <text x="220" y="345" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#8B7B74">Registration Open • 140 RSVP'd</text>
    <rect x="495" y="328" width="70" height="16" rx="8" fill="#FAF1DE"/>
    <text x="530" y="339" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#8E6714" text-anchor="middle">ACTIVE</text>
  </g>
</svg>
